name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match VERSION $version"
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          architecture: x64
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run regression tests before packaging
        shell: pwsh
        run: |
          python -m unittest formula_ocr_app.recognition_tests formula_ocr_app.update_tests formula_ocr_app.runtime_tests formula_ocr_app.ui_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:FORMULA_OCR_CONDA_ENV = Split-Path (Get-Command python).Source
          .\build_installer.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: FormulaOCR-Windows-Installer
          path: |
            dist/installer/FormulaOCRSetup-*.exe
            dist/installer/FormulaOCRSetup-*.exe.sha256
          if-no-files-found: error

      - name: Upload draft GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/installer/FormulaOCRSetup-*.exe
            dist/installer/FormulaOCRSetup-*.exe.sha256
