name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          architecture: x64
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run regression tests
        shell: pwsh
        run: |
          python -m unittest formula_ocr_app.recognition_tests formula_ocr_app.update_tests formula_ocr_app.runtime_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($check in @("--ui-self-test", "--word-mathml-self-test", "--runtime-self-test")) {
            python formula_ocr_app\app.py $check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
